# ~/setup/portainer.toml
#
# Installs Docker from the official repo, then Portainer as a compose project.
# Shows: depends, repos, apt, compose (via URL), and a bash step running under
# a manifest-level workdir default.

name = "portainer"
depends = ["docker"]

# Manifest-level default: this whole unit's bash steps run under ~/apps/portainer
workdir = "~/apps/portainer"

# --- Docker engine, from the official repo -----------------------------------

[[step]]
type = "repo"
source = "https://download.docker.com/linux/debian"
keyring = "https://download.docker.com/linux/debian/gpg"
components = ["stable"]

[[step]]
type = "apt"
update = true
packages = ["docker-ce", "docker-ce-cli", "docker-compose-plugin"]

# --- Portainer, as a compose project fetched fresh from a URL -----------------

[[step]]
type = "compose"
project = "portainer"
file = "@url:https://downloads.portainer.io/ce-sts/portainer-compose.yaml"

# --- A one-off per-user tweak -------------------------------------------------
# Runs as YOU (bash defaults to user), under the manifest workdir (~/apps/portainer)

[[step]]
type = "bash"
script = """
chmod 700 .
"""
